#REGION POSTGRES/DATASOURCE
spring.datasource.url=jdbc:postgresql://${NEON_HOST}/${NEON_DB}?sslmode=require
spring.datasource.username=${NEON_USER}
spring.datasource.password=${NEON_PASSWORD}
#REGION HIKARI
spring.datasource.hikari.maximumPoolSize=5
#prevent cold start dealy
spring.datasource.hikari.connectionTimeout=30000
#short since neon stops calculation at inactivity
spring.datasource.hikari.maxLifetime=240000