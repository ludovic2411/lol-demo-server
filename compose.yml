# Use postgres/example user/password credentials

services:
  keycloak:
    container_name: baeldung-keycloak.openid-provider
    image: quay.io/keycloak/keycloak:latest
    command:
      - start
      - --import-realm
      - --hostname=localhost
      - --hostname-strict=false
    ports:
      - "9090:9090"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/:/opt/keycloak/data/import/
    secrets:
      - postgres_user
      - postgres_password
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 9090
#      KC_HOSTNAME_URL: http://localhost:9090
#      KC_HOSTNAME_ADMIN_URL: http://localhost:9090
#      KC_HOSTNAME_STRICT_BACKCHANNEL: true
      KC_HTTP_RELATIVE_PATH: /
      KC_HTTP_ENABLED: true
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      # --- Newconfig DB Postgres ---
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
#        Healthcheck cannot be used since the endpoint is used only from within the keycloak container
#    healthcheck:
#      test: [ 'CMD-SHELL', '[ -f /tmp/HealthCheck.java ] || echo "public class HealthCheck { public static void main(String[] args) throws java.lang.Throwable { System.exit(java.net.HttpURLConnection.HTTP_OK == ((java.net.HttpURLConnection)new java.net.URL(args[0]).openConnection()).getResponseCode() ? 0 : 1); } }" > /tmp/HealthCheck.java && java /tmp/HealthCheck.java http://localhost:9090/health/live' ]
#      interval: 5s
#      timeout: 5s
#      retries: 20

  db:
    image: postgres:18
    restart: always
    shm_size: 128mb
    labels:
      org.springframework.boot.ignore: "true"
    ports:
      - "5432:5432"
    secrets:
      - postgres_user
      - postgres_password
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d keycloak" ]
      interval: 5s
      timeout: 5s
      retries: 10

  db-init:
    image: postgres:18
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_NAME: testdb
      APP_DB_USER: ${APP_DB_USER:-app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - ./db-init:/db-init:ro
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >
        psql -v ON_ERROR_STOP=1 -d postgres
        -v app_db="$$APP_DB_NAME"
        -v app_user="$$APP_DB_USER"
        -v app_password="$$APP_DB_PASSWORD"
        -f /db-init/01-create-app-db.sql

volumes:
  keycloak-data:
  postgres-data:

secrets:
  postgres_user:
    file: ./postgres_user.txt
  postgres_password:
    file: ./postgres_password.txt